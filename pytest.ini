[tool:pytest]
testpaths = validation_calibration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=simulation_toolkit
    --cov-report=html
    --cov-report=term-missing
    --strict-markers
markers =
    narrow_pulse: Unit tests
    ; integration: Integration tests
    ; slow: Slow running tests
    ; gpu: Tests requiring GPU